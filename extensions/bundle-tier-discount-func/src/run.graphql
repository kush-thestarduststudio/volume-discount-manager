query RunInput($collectionIds: [ID!]) {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inAnyCollection(ids: $collectionIds)
          }
        }
      }
      tierSplitAttr: attribute(key: "_tier_split") {
        value
      }
      tierQtyAttr: attribute(key: "_tier_qty") {
        value
      }
      bundleAttr: attribute(key: "_bundle") {
        value
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:bundle_tiers", key: "config") {
      value
    }
  }
}
