# Nginx Configuration for Hostinger VPS & Shopify Embedded App
# Place this in /etc/nginx/sites-available/bundle-tier-app and symlink to sites-enabled

server {
    listen 80;
    server_name your-domain.com; # Replace with your custom domain or VPS IP

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com; # Replace with your custom domain

    # SSL Certificates (managed by certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Critical Shopify Embedded App Iframe Security Headers
    # Allows embedding inside Shopify Admin while blocking arbitrary unauthorized clickjacking
    add_header Content-Security-Policy "frame-ancestors https://*.myshopify.com https://admin.shopify.com;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse Proxy to Docker App Container (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & App Bridge support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_buffering off;
    }
}
