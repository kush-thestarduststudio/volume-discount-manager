services:
  postgres:
    image: postgres:16-alpine
    container_name: bundle_discount_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopify
      POSTGRES_PASSWORD: shopify_secure_pwd
      POSTGRES_DB: shopify_discounts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopify -d shopify_discounts"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bundle_discount_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://shopify:shopify_secure_pwd@postgres:5432/shopify_discounts?schema=public
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_APP_URL=${SHOPIFY_APP_URL}
      - SCOPES=read_products,write_products,read_discounts,write_discounts,read_themes,write_themes

volumes:
  postgres_data:
